[project]
name = "panelini"
version = "0.11.0"
description = "Panelini is a user-friendly Python package designed to provide an out-of-the-box panel with a beautiful and responsive layout. It simplifies the creation of interactive dashboards by handling dynamic content seamlessly using Python Panel components. Whether you're building complex data visualizations or simple interactive interfaces, panelini offers an easy-to-use solution that enhances productivity and aesthetics."
authors = [{ name = "Andreas Räder", email = "andreas.raeder@isc.fraunhofer.de" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "panel>=1.7.1",
    "param>=2.2.1",
    "watchfiles>=1.1.0",
]

[project.optional-dependencies]
plotting = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
]
standard = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
]
ai = [
    "langchain>=0.3.27",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.27",
    "langchain-openai>=0.3.32",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]
ai-drawio = [
    "anthropic>=0.39",
    "pillow>=10.0",
]
ai-llm-sandbox = [
    "llm-sandbox[docker]>=0.2",
    "pillow>=10.0",
]
ai-osw = [
    "osw>=1.0",
    "SPARQLWrapper>=2.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://opensemanticworld.github.io/panelini/"
Repository = "https://github.com/opensemanticworld/panelini"
Documentation = "https://opensemanticworld.github.io/panelini/"

[dependency-groups]
plotting = [
    "pandas>=2.0.0",
    "plotly>=5.0.0",
]
dev = [
    { include-group = "plotting" },
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.23.0",
    "ty>=0.0.68",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.5",
    "sphinx>=7.2.0",
    "furo>=2024.1.29",
    "myst-parser>=3.0.0",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-autobuild>=2024.2.4",
    "sphinx-design>=0.6.0",
    "sphinxcontrib-mermaid>=1.0.0",
    "pytest-playwright>=0.7.2",
    "pytest-asyncio>=0.23",
    "osw>=1.0.1",
    "python-semantic-release>=10.6,<11",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "langchain>=0.3.27",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.27",
    "langchain-openai>=0.3.32",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panelini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ui: UI tests requiring Playwright (browser)",
    "ai: AI tests requiring langchain and related packages",
    "media: UI tests that also record docs media when run with --record-media",
    "portfolio: Pyodide portfolio app tests (slow, needs built apps via `make portfolio`)",
]

[tool.ruff]
target-version = "py39"
line-length = 120
fix = true
exclude = ["**/dist/**"]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Dev-only docs build script: trusted, hardcoded `uv`/`panel` CLI invocations.
"docs/gen_portfolio.py" = ["S603", "S607"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "{version}"
commit_message = "chore(release): {version} [skip ci]"
# current version is 0.x; PSR v10 defaults (allow_zero_version=false) would jump straight to 1.0.0 on first release
allow_zero_version = true
# keep uv.lock in sync with the bumped version within the same release commit;
# build_command regenerates it, assets makes PSR actually commit it
build_command = "uv lock"
assets = ["uv.lock"]

[tool.semantic_release.changelog]
# append new releases after the marker in the seeded CHANGELOG.md instead of
# regenerating full history from non-conventional pre-existing commits
mode = "update"

[tool.deptry]
exclude = ["src/panelini/components/migration"]

[tool.deptry.per_rule_ignores]
DEP002 = ["watchfiles", "langchain", "langchain-community", "python-dotenv", "anthropic", "pillow"]
DEP003 = ["langchain-core", "langchain_core", "pydantic"]
DEP004 = [
    "langchain",
    "langchain-anthropic",
    "langchain-community",
    "langchain-openai",
    "llm-sandbox",
    "python-dotenv",
    "pyyaml",
]

[tool.ty.environment]
extra-paths = ["docs"]

[tool.pyright]
extraPaths = ["docs"]
typeCheckingMode = "off"
