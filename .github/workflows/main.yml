name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run full tests including headless ui tests
        run: make test-full

      - name: Check typing
        run: uv run mypy


      - name: Upload coverage reports to Codecov with GitHub Action on Python 3.11
        uses: codecov/codecov-action@v4
        if: ${{ matrix.python-version == '3.11' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check if documentation can be built
        run: uv run sphinx-build -b html docs docs/_build/html -W --keep-going

  version-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Compute next version (dry run)
        id: preview
        run: |
          {
            echo 'body<<EOF'
            echo "### Next version if merged"
            NEXT_VERSION=$(uv run semantic-release version --print 2>/dev/null || true)
            if [ -z "$NEXT_VERSION" ]; then
              echo "_No release-worthy commits on this PR yet (no version bump would be triggered)._"
            else
              echo "Merging this PR would release **$NEXT_VERSION**."
              echo
              echo '```'
              uv run semantic-release changelog --print 2>/dev/null || true
              echo '```'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment next version on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: version-preview
          message: ${{ steps.preview.outputs.body }}
