# Default AI provider configuration for Panelini.
# Override by setting PANELINI_AI_CONFIG_PATH to point to your own config.yml.

providers:
  anthropic:
    display_name: "Anthropic Foundry"
    client_type: "anthropic"
    env_vars:
      api_key: "${ANTHROPIC_FOUNDRY_API_KEY}"
      endpoint: "${ENDPOINT}"
    models:
      - name: "Claude Haiku 4.5"
        value: "anthropic/claude-haiku-4-5"
      - name: "Claude Sonnet 5.5"
        value: "anthropic/claude-sonnet-5-5"
      - name: "Claude Sonnet 5"
        value: "anthropic/claude-sonnet-5"
      - name: "Claude Sonnet 4.6"
        value: "anthropic/claude-sonnet-4-6"
      - name: "Claude Opus 5"
        value: "anthropic/claude-opus-5"
      - name: "Claude Opus 4.7"
        value: "anthropic/claude-opus-4-7"
      - name: "Claude Opus 4.6"
        value: "anthropic/claude-opus-4-6"
      - name: "Claude Opus 5.5"
        value: "anthropic/claude-opus-5-5"

  azure_openai:
    display_name: "Azure OpenAI"
    client_type: "azure_openai"
    env_vars:
      api_key: "${AZURE_OPENAI_API_KEY}"
      endpoint: "${AZURE_OPENAI_ENDPOINT}"
      api_version: "${AZURE_OPENAI_API_VERSION}"
    models:
      - name: "GPT-6 Luna"
        value: "azure_openai/gpt-6-luna"
      - name: "GPT-6 Astra"
        value: "azure_openai/gpt-6-astra"
      - name: "GPT-6.1 Sol"
        value: "azure_openai/gpt-6.1-sol"
